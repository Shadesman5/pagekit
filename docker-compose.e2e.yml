version: '3.8'

services:
  # PHP + Apache Web Server for E2E Testing
  web-e2e:
    build: .
    container_name: pagekit_web_e2e
    ports:
      - "8180:80"
    volumes:
      - .:/var/www/html
      - ./storage-e2e:/var/www/html/storage
      - ./tmp-e2e:/var/www/html/tmp
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini
    depends_on:
      - mysql-e2e
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
      - APP_ENV=test
      - DEBUG=true
      - DB_HOST=mysql-e2e
      - DB_PORT=3306
      - DB_NAME=pagekit_e2e_test
      - DB_USER=pagekit_e2e
      - DB_PASSWORD=pagekit_e2e_pass
      - DB_PREFIX=pk_
    networks:
      - pagekit_e2e_network

  # MySQL Database for E2E Testing
  mysql-e2e:
    image: mysql:8.4
    container_name: pagekit_mysql_e2e
    ports:
      - "3307:3306"
    volumes:
      - mysql_e2e_data:/var/lib/mysql
      - ./tests/e2e/fixtures:/docker-entrypoint-initdb.d
    environment:
      MYSQL_ROOT_PASSWORD: root_e2e_pass
      MYSQL_DATABASE: pagekit_e2e_test
      MYSQL_USER: pagekit_e2e
      MYSQL_PASSWORD: pagekit_e2e_pass
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - pagekit_e2e_network

  # phpMyAdmin for E2E Testing (optional)
  phpmyadmin-e2e:
    image: phpmyadmin/phpmyadmin:latest
    container_name: pagekit_phpmyadmin_e2e
    ports:
      - "8181:80"
    environment:
      PMA_HOST: mysql-e2e
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root_e2e_pass
    depends_on:
      - mysql-e2e
    networks:
      - pagekit_e2e_network
    profiles:
      - debug

  # Node.js for E2E Test Execution
  node-e2e:
    image: node:20-alpine
    container_name: pagekit_node_e2e
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install && npx playwright test"
    networks:
      - pagekit_e2e_network
    profiles:
      - test

volumes:
  mysql_e2e_data:

networks:
  pagekit_e2e_network:
    driver: bridge