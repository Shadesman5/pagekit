; PHP configuration for the Pagekit production image.
; Loaded from conf.d on top of php.ini-production, so every setting here either
; overrides that baseline or states a value the image guarantees regardless of it.

; Errors reach the container log, never the visitor: a stack trace on the page
; hands out paths, queries and credentials.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Keep the PHP version out of the response headers.
expose_php = Off

; The image is immutable, so compiled files are cached without ever stat'ing the
; sources again. config.php is the one PHP file written while the container runs,
; and the settings screens and the installer invalidate it themselves after
; writing it. The package registry needs no such care: packages/ is root-owned
; while requests run as www-data, so nothing can rewrite it after the build.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

; Sessions. The cookie is HTTP-only and rejects session IDs the server never
; issued; its Secure and SameSite flags are set by public/.htaccess, which is
; also where a shared-hosting install gets them from.
session.cookie_httponly = 1
session.use_strict_mode = 1

; Timestamps are stored and rendered in UTC; the front controller sets the same
; zone, so a request is unaffected by the host's clock configuration.
date.timezone = UTC

; Resource limits. Ordinary requests need a fraction of this; the headroom and a
; time limit above the usual production 30s are for the two slow paths the
; container serves: a media upload at the size allowed below, and the install
; request that creates the database schema.
memory_limit = 256M
max_execution_time = 120
upload_max_filesize = 64M
post_max_size = 64M

; Admin forms post one field per widget, menu item or permission, which exceeds
; the default cap on a site of any size.
max_input_vars = 3000
