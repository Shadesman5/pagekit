; PHP configuration for the Pagekit Docker development stack.
; Mounted into the web service by docker-compose.yml; development only, which is
; why errors are displayed and the resource limits below are generous.
memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
max_input_vars = 3000

; Error reporting for development
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; Session configuration
session.cookie_httponly = 1
session.use_strict_mode = 1

; Security
expose_php = Off

; Date timezone
date.timezone = Europe/Berlin

; OPcache for better performance
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 4000
opcache.revalidate_freq = 2
