# Codecov configuration — INFORMATIONAL (non-blocking) by design.
#
# Coverage is still low and grows per feature branch; the hard pass/fail
# coverage gate lives in .github/workflows/php-tests.yml (the ratcheting
# MIN_LINE_COVERAGE check). Codecov here ONLY reports project/patch deltas and
# posts the PR comment — it must never fail a PR. Re-evaluate flipping these to
# blocking once broad coverage lands (ROADMAP Step 2.11 — Phase 2 Closeout).

# Files with no meaningful unit-test surface — exclude from Codecov reports
# (avoids 0% patch noise on version bumps, front controllers, module manifests).
ignore:
  - "app/system/config.php"
  - "index.php"
  - "**/index.php"

coverage:
  status:
    project:
      default:
        informational: true   # report only, never fail the PR
    patch:
      default:
        informational: true   # report only, never fail the PR

comment:
  layout: "reach, diff, flags, files"
  require_changes: false       # always post, even when coverage is unchanged
