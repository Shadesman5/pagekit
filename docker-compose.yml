version: '3.8'

services:
  # PHP + Apache Web Server
  web:
    build: .
    container_name: pagekit_web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini
    depends_on:
      - mysql
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    networks:
      - pagekit_network

  # MySQL Database (default)
  mysql:
    image: mysql:8.4
    container_name: pagekit_mysql
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    environment:
      MYSQL_ROOT_PASSWORD: pagekit
      MYSQL_DATABASE: pagekit
      MYSQL_USER: pagekit
      MYSQL_PASSWORD: pagekit
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - pagekit_network
    profiles:
      - mysql
      - default

  # phpMyAdmin (only with MySQL)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: pagekit_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: pagekit
    depends_on:
      - mysql
    networks:
      - pagekit_network
    profiles:
      - mysql
      - default

  # Node.js for Frontend Development
  node:
    image: node:18-alpine
    container_name: pagekit_node
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install -g yarn@1.22.22 && yarn install && yarn watch-all"
    networks:
      - pagekit_network

volumes:
  mysql_data:

networks:
  pagekit_network:
    driver: bridge
