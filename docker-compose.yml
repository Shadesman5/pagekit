# Development stack: the working tree is bind-mounted into PHP/Apache, with MySQL,
# phpMyAdmin and a Node watcher alongside it.
# Database credentials are read from .env, generated by ./docker-setup.sh
# (docker-setup.ps1 on Windows). To run without a database server and install
# Pagekit on SQLite instead: docker compose up -d --no-deps web node

services:
  # PHP + Apache. The project is mounted live, so edits need no image rebuild.
  web:
    build:
      context: .
      # The Dockerfile builds the production runtime by default; development
      # stops at the stage that bakes no code.
      target: dev
    container_name: pagekit_web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - pagekit_network

  # MySQL. The image creates the database, the user and its grants from these
  # variables on the first boot of an empty data volume.
  mysql:
    image: mysql:8.4
    container_name: pagekit_mysql
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Run ./docker-setup.sh first}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Run ./docker-setup.sh first}"
    # Ping over TCP, not the socket: during first-boot initialization the entrypoint
    # runs a temporary socket-only server, and a socket ping would report healthy
    # while the port is still unreachable.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - pagekit_network

  # Database UI on http://localhost:8081, signed in as the MySQL root user.
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: pagekit_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: "3306"
      PMA_USER: root
      PMA_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - pagekit_network

  # Node.js for Frontend Development
  node:
    image: node:22-alpine
    container_name: pagekit_node
    working_dir: /app
    volumes:
      - .:/app
    # node:22-alpine ships corepack, which activates the pnpm version pinned in
    # package.json. Installing does not build, so build once before watching.
    command: sh -c "corepack enable && pnpm install && pnpm build && pnpm watch"
    networks:
      - pagekit_network

volumes:
  mysql_data:

networks:
  pagekit_network:
    driver: bridge
