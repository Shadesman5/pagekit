# Import the V1 XL Review+E2E parent agent into the in-progress Conductor session.
#
# Trigger: a push to feature/** that flips `- [ ] Step N (XL)` → `- [x]` in an
# active ticket. Requires both the removed unchecked line and the added checked
# line so a brand-new ticket that already has `[x]` does not fire.
# No in_progress Conductor session → exit 0 (full V1 tickets still use
# import-v1-metrics.yml at merge). Do not put `v1-metrics` on a Conductor PR.
#
# Requires secret: CURSOR_API_KEY (same as Conductor).

name: Import XL Handoff Metrics

run-name: "XL metrics — ${{ github.ref_name }}"

on:
  push:
    branches: ['feature/**']
    paths:
      - 'migration-docs/tickets/active/**'
  workflow_dispatch:

permissions:
  contents: write # push to conductor-metrics
  actions: write # dispatch pages-deploy after metrics push

concurrency:
  group: xl-handoff-metrics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    name: Import XL handoff metrics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0

      - name: Detect XL tick and import
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
          else
            BEFORE="$(git rev-parse HEAD^)"
            AFTER="$(git rev-parse HEAD)"
          fi
          if [ -z "${BEFORE:-}" ] || [[ "$BEFORE" =~ ^0+$ ]]; then
            echo "No parent commit on this push — skip (need an unchecked→checked XL transition)."
            exit 0
          fi
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BEFORE" --depth=1 || true
          fi
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "before SHA not in history — skip"
            exit 0
          fi
          git diff "$BEFORE" "$AFTER" -- migration-docs/tickets/active > /tmp/xl-ticket.diff
          node .github/conductor/xl-handoff-metrics.mjs \
            --diff /tmp/xl-ticket.diff \
            --branch "${GITHUB_REF_NAME}" \
            --push
