name: PHP Tests

run-name: "${{ github.event_name == 'pull_request' && format('PHP Tests — PR #{0} ({1})', github.event.pull_request.number, github.head_ref) || format('PHP Tests — {0}', github.ref_name) }}"

on:
  push:
    branches: [main, develop]
    # Conductor session metrics live on conductor-metrics and the live quality
    # snapshot lives on quality-data — neither is produced on main/develop. Keep
    # both ignores as defense in depth so a metrics-only path change never spends
    # a CI run on a protected branch.
    paths-ignore:
      - '.github/conductor/metrics/**'
      - '.github/quality/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '.github/conductor/metrics/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: phpunit (${{ matrix.php }})
    runs-on: ubuntu-latest
    # id-token: write lets the Codecov step authenticate tokenless via OIDC
    # (no CODECOV_TOKEN secret needed). contents: read is required for checkout;
    # job-level permissions REPLACE the workflow-level block, so restate it here.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          tools: composer:v2

      - name: Cache Composer dependencies (app/vendor) and the PHPUnit result cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            app/vendor
            .phpunit.cache
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Create writable runtime directories
        run: mkdir -p tmp/logs tmp/cache tmp/temp tmp/packages storage

      - name: Run PHPUnit with coverage
        run: ./app/vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml --log-junit=junit.xml

      - name: Upload coverage artifact
        if: matrix.php == '8.5'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-clover
          path: coverage.xml
          if-no-files-found: error

      # JUnit report feeds the sticky PR comment / quality snapshot renderers.
      # always() so a failing suite still reports its per-test results.
      - name: Upload JUnit report artifact
        if: always() && matrix.php == '8.5'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: junit
          path: junit.xml
          if-no-files-found: warn

      # Codecov upload — feeds the README badge and per-PR coverage-delta comments
      # off the same Clover report. Kept NON-BLOCKING (fail_ci_if_error: false) so
      # the quality gate never depends on Codecov availability. Authenticates
      # TOKENLESS via OIDC (use_oidc: true) — no CODECOV_TOKEN secret to manage or
      # rotate; relies on the job-level id-token: write permission set above.
      # EXTERNAL ACTIVATION REQUIRED: a human must still install the Codecov GitHub
      # App on Shadesman5/pagekit so the repo is registered on Codecov (enables the
      # badge + PR delta comments). Note: OIDC is unavailable for PRs from forks —
      # those fall back to the public-repo tokenless path or simply no-op (non-blocking).
      - name: Upload coverage to Codecov
        if: matrix.php == '8.5'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: ./coverage.xml
          slug: Shadesman5/pagekit
          fail_ci_if_error: false
          use_oidc: true

      # Ratcheting minimum line-coverage gate. The floor is pinned to this branch's
      # measured line coverage: 3.86% (1833/47535 statements, PCOV 1.0.11 / PHP
      # 8.3.6, 2026-07-09), rounded DOWN to 3.8% for float jitter. CI and local
      # agents both use PCOV. Policy: ratchet MIN_LINE_COVERAGE UP as coverage
      # grows, NEVER lower it. Plain PHP parse of the Clover <project><metrics>
      # node — no extra tooling required.
      - name: Enforce minimum line coverage
        if: matrix.php == '8.5'
        env:
          MIN_LINE_COVERAGE: '3.8'
        run: |
          php -r '
            $min = (float) getenv("MIN_LINE_COVERAGE");
            $dom = new DOMDocument();
            if (!@$dom->load("coverage.xml")) {
                fwrite(STDERR, "ERROR: unable to load coverage.xml\n");
                exit(2);
            }
            $nodes = (new DOMXPath($dom))->query("/coverage/project/metrics");
            if ($nodes === false || $nodes->length === 0) {
                fwrite(STDERR, "ERROR: <project><metrics> not found in coverage.xml\n");
                exit(2);
            }
            $metrics = $nodes->item(0);
            $statements = (int) $metrics->getAttribute("statements");
            $covered = (int) $metrics->getAttribute("coveredstatements");
            if ($statements <= 0) {
                fwrite(STDERR, "ERROR: coverage.xml reports zero statements\n");
                exit(2);
            }
            $rate = $covered / $statements * 100;
            printf("Line coverage: %.4f%% (%d/%d statements) | required floor: %.2f%%\n", $rate, $covered, $statements, $min);
            if ($rate + 1e-9 < $min) {
                fwrite(STDERR, sprintf("FAIL: line coverage %.4f%% is below the required %.2f%% baseline (ratchets up, never down).\n", $rate, $min));
                exit(1);
            }
            echo "PASS: line coverage meets the ratcheted baseline.\n";
          '

  # Non-blocking MySQL leg. Runs the suite against a real MySQL server via
  # phpunit-mysql.xml.dist, which wires the db_*/tmpdb_* globals DbUtil needs. Only
  # the DbTestCase/DbUtil consumers (ConfigManagerTest, EntityManagerTest) honor
  # those globals today — the rest of the suite still uses in-memory SQLite — so this
  # leg genuinely exercises the DbUtil paths on MySQL without being a full portability
  # gate. It is deliberately NOT the required "phpunit (8.5)" context: kept advisory
  # via continue-on-error so a MySQL-only failure never blocks a merge.
  # TODO: Must be refactored in Step 2.11 (Phase 2 Closeout) — flip to required once the suite is DB-portable
  phpunit-mysql:
    name: phpunit-mysql
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        # mysqladmin ping returns success once the server accepts connections, so it
        # gates the steps below until MySQL is actually ready to serve queries.
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          # pdo_mysql is required for the Doctrine DBAL pdo_mysql driver DbUtil opens;
          # without it the connection would fail and the DB tests would skip (fake green).
          extensions: pdo_mysql
          tools: composer:v2

      - name: Cache Composer dependencies (app/vendor)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: app/vendor
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.5-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Create writable runtime directories
        run: mkdir -p tmp/logs tmp/cache tmp/temp tmp/packages storage

      - name: Run PHPUnit against MySQL
        run: ./app/vendor/bin/phpunit -c phpunit-mysql.xml.dist

  phpstan:
    name: phpstan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies (app/vendor)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: app/vendor
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.5-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPStan (Level 8 + baseline)
        run: ./app/vendor/bin/phpstan analyse --no-progress --error-format=github

      # Machine-readable copy for the sticky PR comment / quality snapshot renderers.
      # PHPStan reuses its result cache, so this re-render is near-instant; || true
      # keeps the artifact step green because the github-format run above is the gate.
      - name: Generate PHPStan JSON report
        if: always()
        run: ./app/vendor/bin/phpstan analyse --no-progress --error-format=json > phpstan.json || true

      - name: Upload PHPStan report artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: phpstan-report
          path: phpstan.json
          if-no-files-found: warn

  cs-fixer:
    name: cs-fixer
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies (app/vendor)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: app/vendor
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.5-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHP-CS-Fixer (dry-run)
        # --allow-risky=yes is required because .php-cs-fixer.php enables risky rules
        # (modernize_types_casting, declare_strict_types). Matches the local invocation.
        # CS-Fixer runs dry-run only in CI (no autofix) — any violation fails the gate.
        run: ./app/vendor/bin/php-cs-fixer fix --dry-run --diff --no-interaction --show-progress=none --allow-risky=yes

  security-audit:
    name: security-audit
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Run Composer security audit
        run: composer audit --locked --no-interaction --abandoned=ignore

  # Lightweight guard: asserts the supported PHP minor version is identical across
  # composer.json, this workflow matrix, the installer requirement, both Docker base
  # images and the README badge. Plain PHP, no composer install (tools: none) — a
  # drifted source fails the job and names the offender. PR-only: it guards changes
  # under review and has nothing to check on a merge to a protected branch.
  version-ssot:
    name: version-ssot
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: none

      - name: Check PHP version single source of truth
        run: php .github/scripts/check-version-ssot.php
