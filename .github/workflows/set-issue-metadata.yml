# Sets labels and milestones on GitHub issues.
# Can be triggered manually via GitHub UI or CLI: gh workflow run set-issue-metadata.yml
#
# Supports two modes:
#   1. Batch mode: Apply labels/milestones to a range of issues from ROADMAP mapping
#   2. Single mode: Apply specific labels/milestone to a single issue
#
# Requires:
#   Secret: PROJECT_TOKEN - PAT with repo scope (same token as project-auto-phase.yml)

name: Set Issue Metadata

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode: "batch" (use built-in ROADMAP mapping) or "single" (specify issue/labels/milestone)'
        required: true
        default: 'batch'
        type: choice
        options:
          - batch
          - single
      issue_number:
        description: '[Single mode] Issue number (e.g. 124)'
        required: false
        type: string
      labels:
        description: '[Single mode] Comma-separated labels (e.g. "phase-1,migration,backend")'
        required: false
        type: string
      milestone:
        description: '[Single mode] Milestone name (e.g. "Phase 1: Foundation")'
        required: false
        type: string
      dry_run:
        description: 'Dry run - only show what would be done, do not apply changes'
        required: false
        default: false
        type: boolean

permissions:
  issues: write

jobs:
  set-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Set metadata on issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const mode = '${{ inputs.mode }}';
            const dryRun = ${{ inputs.dry_run }};

            // ================================================================
            // ROADMAP BATCH MAPPING
            // Update this map when new issues need labels/milestones.
            // Format: issueNumber: { labels: [...], milestone: "..." }
            // Label formula: 1 phase label + 1 type label + 1-2 area labels
            // ================================================================
            const batchMapping = {
              124: { labels: ['phase-1', 'migration', 'backend'], milestone: 'Phase 1: Foundation' },
              125: { labels: ['phase-1', 'migration', 'database', 'backend'], milestone: 'Phase 1: Foundation' },
              126: { labels: ['phase-1', 'migration', 'backend'], milestone: 'Phase 1: Foundation' },
              127: { labels: ['phase-1', 'migration', 'backend'], milestone: 'Phase 1: Foundation' },
              128: { labels: ['phase-1', 'migration', 'backend'], milestone: 'Phase 1: Foundation' },
              129: { labels: ['phase-1', 'migration', 'backend'], milestone: 'Phase 1: Foundation' },
              130: { labels: ['phase-1', 'migration', 'backend'], milestone: 'Phase 1: Foundation' },
              131: { labels: ['phase-1', 'migration', 'database', 'backend'], milestone: 'Phase 1: Foundation' },
              132: { labels: ['phase-1', 'migration', 'database'], milestone: 'Phase 1: Foundation' },
              133: { labels: ['phase-1', 'migration', 'backend'], milestone: 'Phase 1: Foundation' },
              134: { labels: ['phase-1', 'migration', 'database', 'backend'], milestone: 'Phase 1: Foundation' },
              135: { labels: ['phase-1', 'enhancement', 'frontend'], milestone: 'Phase 1: Foundation' },
              136: { labels: ['phase-1', 'security', 'backend', 'frontend'], milestone: 'Phase 1: Foundation' },
            };

            // Helper: get milestone number by name
            async function getMilestoneNumber(milestoneName) {
              const milestones = await github.rest.issues.listMilestones({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
              });
              const ms = milestones.data.find(m => m.title === milestoneName);
              return ms ? ms.number : null;
            }

            // Helper: apply labels and milestone to a single issue
            async function applyMetadata(issueNumber, labels, milestoneName) {
              const issue = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });

              const currentLabels = issue.data.labels.map(l => l.name);
              const newLabels = labels.filter(l => !currentLabels.includes(l));
              const currentMilestone = issue.data.milestone ? issue.data.milestone.title : null;

              console.log(`\n--- #${issueNumber}: ${issue.data.title} ---`);
              console.log(`  Current labels: [${currentLabels.join(', ')}]`);
              console.log(`  Current milestone: ${currentMilestone || 'None'}`);

              if (newLabels.length === 0 && currentMilestone === milestoneName) {
                console.log(`  ✅ Already up to date`);
                return { issue: issueNumber, status: 'skipped', reason: 'already up to date' };
              }

              if (dryRun) {
                if (newLabels.length > 0) console.log(`  [DRY RUN] Would add labels: [${newLabels.join(', ')}]`);
                if (currentMilestone !== milestoneName) console.log(`  [DRY RUN] Would set milestone: ${milestoneName}`);
                return { issue: issueNumber, status: 'dry-run' };
              }

              // Add labels
              if (newLabels.length > 0) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: newLabels,
                });
                console.log(`  ✅ Added labels: [${newLabels.join(', ')}]`);
              }

              // Set milestone
              if (currentMilestone !== milestoneName) {
                const milestoneNumber = await getMilestoneNumber(milestoneName);
                if (milestoneNumber) {
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    milestone: milestoneNumber,
                  });
                  console.log(`  ✅ Set milestone: ${milestoneName}`);
                } else {
                  console.log(`  ❌ Milestone "${milestoneName}" not found!`);
                  return { issue: issueNumber, status: 'error', reason: `milestone not found: ${milestoneName}` };
                }
              }

              return { issue: issueNumber, status: 'updated' };
            }

            // ================================================================
            // MAIN
            // ================================================================
            const results = [];

            if (mode === 'batch') {
              console.log('=== BATCH MODE: Applying ROADMAP mapping ===');
              console.log(`Processing ${Object.keys(batchMapping).length} issues...`);

              for (const [num, config] of Object.entries(batchMapping)) {
                try {
                  const result = await applyMetadata(parseInt(num), config.labels, config.milestone);
                  results.push(result);
                } catch (err) {
                  console.log(`  ❌ Error on #${num}: ${err.message}`);
                  results.push({ issue: parseInt(num), status: 'error', reason: err.message });
                }
              }
            } else {
              // Single mode
              const issueNumber = parseInt('${{ inputs.issue_number }}');
              const labels = '${{ inputs.labels }}'.split(',').map(l => l.trim()).filter(Boolean);
              const milestone = '${{ inputs.milestone }}';

              if (!issueNumber || labels.length === 0) {
                core.setFailed('Single mode requires issue_number and labels');
                return;
              }

              console.log('=== SINGLE MODE ===');
              try {
                const result = await applyMetadata(issueNumber, labels, milestone);
                results.push(result);
              } catch (err) {
                console.log(`  ❌ Error: ${err.message}`);
                results.push({ issue: issueNumber, status: 'error', reason: err.message });
              }
            }

            // Summary
            const updated = results.filter(r => r.status === 'updated').length;
            const skipped = results.filter(r => r.status === 'skipped').length;
            const errors = results.filter(r => r.status === 'error').length;
            const dryRunCount = results.filter(r => r.status === 'dry-run').length;

            console.log('\n=== SUMMARY ===');
            console.log(`Updated: ${updated} | Skipped: ${skipped} | Errors: ${errors} | Dry-run: ${dryRunCount}`);

            if (errors > 0) {
              core.setFailed(`${errors} issue(s) failed`);
            }
