# Publishes the live Quality Dashboard snapshot. Runs after a gate workflow (PHP Tests / E2E) finishes
# a push to a protected branch and, when BOTH gates are green, blends their latest merge-run artifacts
# (+ the latest nightly Infection MSI) into .github/quality/quality-snapshot.json on the unprotected
# quality-data branch, then dispatches pages-deploy to rebuild the site.
#
# workflow_run fires from the DEFAULT branch's copy of this file, so it never runs on the PR that adds
# it — the workflow_dispatch trigger allows a manual post-merge collection. The snapshot is written to
# quality-data only (single writer, no Ruleset bypass on the protected branch); GITHUB_TOKEN pushes do
# not re-trigger workflows, hence the explicit pages-deploy dispatch from the collector script.

name: Quality Collect

run-name: "${{ github.event_name == 'workflow_dispatch' && format('Quality Collect — manual ({0})', github.event.inputs.branch) || format('Quality Collect — {0} #{1}', github.event.workflow_run.name, github.event.workflow_run.run_number) }}"

on:
  workflow_run:
    workflows: ["PHP Tests", "E2E"]
    types: [completed]
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      branch:
        description: "Protected branch to collect the snapshot for."
        required: false
        default: develop
        type: string

permissions:
  contents: write  # push the snapshot commit to the quality-data branch
  actions: write   # list gate runs + download their artifacts (read) and dispatch pages-deploy (write)

concurrency:
  # Single writer to quality-data — serialize collections so concurrent merge completions cannot race.
  group: quality-collect
  cancel-in-progress: false

jobs:
  collect:
    name: quality-collect
    runs-on: ubuntu-latest
    # Only a successful PUSH (merge) run yields develop-tip numbers worth publishing; PR runs and
    # failed runs are ignored. workflow_dispatch always proceeds (the operator collects on demand).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    steps:
      - name: Checkout develop (coverage floor + PHPStan baseline SSoT)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: develop
          fetch-depth: 0

      # ubuntu-latest ships Node 20 (global fetch) + gh + git — no extra setup needed.
      - name: Build and publish the live quality snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.event.workflow_run.head_branch }}
        run: node .github/scripts/quality-snapshot.mjs
