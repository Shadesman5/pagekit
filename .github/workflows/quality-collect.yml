# Publishes the live Quality Dashboard snapshot for the develop branch. Runs after a gate workflow
# (PHP Tests / E2E) finishes a push (merge) to develop, or after a successful Nightly, and — when both
# gates are green on one commit — blends their latest merge-run artifacts (+ the latest nightly
# Infection MSI) into .github/quality/quality-snapshot.json on the unprotected quality-data branch,
# then dispatches pages-deploy to rebuild the site.
#
# Nightly is a trigger because its full-suite MSI is the dashboard's only Infection number: without it
# the snapshot keeps a null MSI until some unrelated merge happens to collect again.
#
# Scope is develop only. The dashboard documents the develop tip, pages-deploy builds from develop, and
# a single snapshot file lives on quality-data — also collecting main would overwrite develop's metrics
# with main's on the next green main merge, and would read develop's coverage floor / PHPStan baseline
# (the checked-out tree) against main's test numbers.
#
# workflow_run fires from the DEFAULT branch's copy of this file, so it never runs on the PR that adds
# it — the workflow_dispatch trigger allows a manual post-merge collection. The snapshot is written to
# quality-data only (single writer, no Ruleset bypass on develop); GITHUB_TOKEN pushes do not
# re-trigger workflows, hence the explicit pages-deploy dispatch from the collector script.

name: Quality Collect

run-name: "${{ github.event_name == 'workflow_dispatch' && 'Quality Collect — manual (develop)' || format('Quality Collect — {0} #{1}', github.event.workflow_run.name, github.event.workflow_run.run_number) }}"

on:
  workflow_run:
    workflows: ["PHP Tests", "E2E", "Nightly"]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write  # push the snapshot commit to the quality-data branch
  actions: write   # list gate runs + download their artifacts (read) and dispatch pages-deploy (write)

concurrency:
  # Single writer to quality-data — serialize collections so concurrent merge completions cannot race.
  group: quality-collect
  cancel-in-progress: false

jobs:
  collect:
    name: quality-collect
    runs-on: ubuntu-latest
    # develop is the only branch the dashboard documents. Deriving both the checkout ref and the
    # collector's target branch from one variable keeps the SSoT tree (coverage floor + PHPStan
    # baseline) and the queried gate runs on the same branch — they can never drift apart.
    env:
      SNAPSHOT_BRANCH: develop
    # Only successful non-PR runs yield develop-tip numbers worth publishing: a PUSH (merge) of PHP
    # Tests / E2E, or a SCHEDULED / dispatched Nightly whose full-suite Infection MSI would otherwise
    # sit unread until the next merge. PR runs and failed runs are ignored; workflow_dispatch always
    # proceeds (the operator collects on demand). Collecting twice is harmless — an unchanged snapshot
    # publishes nothing.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request')
    steps:
      - name: Checkout the snapshot branch (coverage floor + PHPStan baseline SSoT)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ env.SNAPSHOT_BRANCH }}
          fetch-depth: 0

      # ubuntu-latest ships Node 20 (global fetch) + gh + git — no extra setup needed.
      - name: Build and publish the live quality snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ env.SNAPSHOT_BRANCH }}
        run: node .github/scripts/quality-snapshot.mjs
