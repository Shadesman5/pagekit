name: Frontend

run-name: "Frontend — PR #${{ github.event.pull_request.number }} (${{ github.head_ref }})"

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Frontend gate — every step blocks. The production build (Vite bundles + LESS + asset copies)
  # must compile the way a release does, and ESLint plus Prettier run over the whole tree: the
  # sources are lint- and format-clean, so any finding here is a regression the PR introduced.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      # Must precede setup-node: `cache: pnpm` below resolves the store path via the pnpm binary.
      # No version input — the action reads it from package.json#packageManager.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Installing does not build (no install lifecycle hook), so the build is an explicit step.
      - name: Build frontend assets (JS bundles, LESS, asset copies)
        run: pnpm build

      - name: ESLint
        run: pnpm lint

      - name: Prettier check
        run: pnpm exec prettier --check .
