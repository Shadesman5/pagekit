name: Nightly

run-name: "Nightly — ${{ github.event_name == 'workflow_dispatch' && format('manual dispatch ({0})', github.actor) || 'scheduled' }}"

on:
  schedule:
    # ~02:00 UTC daily — after typical merge activity, ahead of the working day.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One nightly at a time, and never cancel an in-progress run: each scheduled/dispatched
  # full sweep is independent and worth finishing (no superseding-commit semantics here).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Cheap gate so an idle repo never re-runs the expensive jobs on identical commits: proceed
  # only when something landed in the last 24h. A manual dispatch always bypasses the window.
  guard:
    name: guard
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          # Full history so `git log --since` sees the real commit window, not a shallow slice.
          fetch-depth: 0

      - name: Decide whether the scheduled jobs should run
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  # Full mutation-testing suite (not diff-scoped) over the configured auth + user scope at the
  # 80/80 thresholds from infection.json.dist. Its infection.json + summary.log are the full-suite
  # MSI the live quality snapshot blends from the latest green Nightly run.
  infection-full:
    name: infection-full
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          # PCOV drives the code coverage Infection needs to decide which mutants are covered.
          coverage: pcov
          tools: composer:v2

      - name: Cache Composer dependencies (app/vendor)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/vendor
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.5-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Create writable runtime directories
        run: mkdir -p tmp/logs tmp/cache tmp/temp tmp/packages storage

      - name: Run the full Infection suite
        # No --git-diff flags: mutate the whole configured scope. Thresholds come from
        # infection.json.dist (minMsi/minCoveredMsi = 80), so an MSI regression fails this
        # (non-required) nightly and surfaces as a red signal rather than a silent drop.
        run: ./app/vendor/bin/infection --threads=max

      - name: Upload Infection logs
        # always() so a threshold failure still ships the report the snapshot blend reads.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infection-full-report
          path: |
            tmp/infection/infection.json
            tmp/infection/summary.log
          if-no-files-found: warn

  # The @ci smoke specs across the 3 chromium viewports. Desktop is the real signal; tablet and
  # mobile run the same desktop-optimized specs and are expected to fail today, so they stay
  # non-blocking (fail-fast off below lets all three legs finish and report).
  e2e-viewports:
    name: e2e-viewports (${{ matrix.project }})
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    # TODO: Must be refactored in Step 3.6.1 (E2E Test Suite Rework) — tablet/mobile legs non-blocking until @ci specs are viewport-robust
    continue-on-error: ${{ matrix.project != 'chromium-desktop' }}
    strategy:
      # Keep every viewport leg running even when a non-blocking one fails, so desktop always reports.
      fail-fast: false
      matrix:
        project: [chromium-desktop, chromium-tablet, chromium-mobile]
    env:
      # Expose the tablet + mobile projects in the Playwright config (chromium-desktop only by default).
      PW_VIEWPORTS: all
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies (app/vendor)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/vendor
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.5-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Create writable runtime directories
        run: mkdir -p tmp/logs tmp/cache tmp/temp tmp/packages storage

      # Must precede setup-node: `cache: pnpm` below resolves the store path via the pnpm binary.
      # No version input — the action reads it from package.json#packageManager.
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      # Installing does not build, so build explicitly: the JS bundles, LESS and copied assets
      # are what the installer and admin UI need to render during the E2E run.
      - name: Build frontend assets
        run: pnpm build

      # Copy the tracked example to the git-ignored config the suite reads, then fill the values
      # it cannot ship: real admin credentials (the example's YOUR_* placeholders are rejected by
      # the specs' connectivity precheck, and the installer needs them to create a usable admin)
      # and the 127.0.0.1:8080 origin that `php pagekit start` — the Playwright webServer — binds.
      - name: Prepare E2E test configuration
        run: |
          cp tests/e2e/config/test-config.example.json tests/e2e/config/test-config.json
          node -e "const fs=require('fs'),p='tests/e2e/config/test-config.json',c=JSON.parse(fs.readFileSync(p,'utf8'));c.auth.admin={username:'admin',password:'pagekit-ci-admin',email:'admin@example.com'};c.site.title='Pagekit CI';c.site.url='http://127.0.0.1:8080';c.site.adminUrl='http://127.0.0.1:8080/admin';fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');"

      # Browser binaries live under ~/.cache/ms-playwright; key the cache on the resolved
      # @playwright/test version so a Playwright bump re-downloads matching browsers.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright chromium + OS dependencies
        run: npx playwright install --with-deps chromium

      # --grep @ci selects the 3 optimized specs; --project picks this leg's viewport. The
      # installation spec drives the web installer itself, so no `php pagekit setup` beforehand.
      # The Playwright config starts `php pagekit start` (webServer), so no server step here.
      - name: Run Playwright @ci specs (${{ matrix.project }})
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json
        run: npx playwright test --grep @ci --project=${{ matrix.project }} --reporter=list,json,html

      - name: Upload Playwright JSON report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-nightly-report-${{ matrix.project }}
          path: playwright-results.json
          if-no-files-found: warn

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-nightly-html-${{ matrix.project }}
          path: playwright-report/
          if-no-files-found: warn
