name: PHP Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: phpunit (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          tools: composer:v2

      - name: Cache Composer dependencies (app/vendor)
        uses: actions/cache@v5
        with:
          path: app/vendor
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Create writable runtime directories
        run: mkdir -p tmp/logs tmp/cache tmp/temp tmp/packages storage

      - name: Run PHPUnit with coverage
        run: ./app/vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml

      - name: Upload coverage artifact
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-clover
          path: coverage.xml
          if-no-files-found: error

  phpstan:
    name: phpstan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies (app/vendor)
        uses: actions/cache@v5
        with:
          path: app/vendor
          key: ${{ runner.os }}-php-8.3-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.3-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPStan (Level 5 + baseline)
        run: ./app/vendor/bin/phpstan analyse --no-progress --error-format=github

  cs-fixer:
    name: cs-fixer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies (app/vendor)
        uses: actions/cache@v5
        with:
          path: app/vendor
          key: ${{ runner.os }}-php-8.3-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.3-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHP-CS-Fixer (dry-run)
        # --allow-risky=yes: matches local invocation and the risky `modernize_types_casting`
        # rule already enabled in `.php-cs-fixer.php`. The risky rule is tagged
        # `// TODO: Must be refactored in Step 2.1.3 (strict_types Migration)` and stays
        # in scope of that step; CS-Fixer remains dry-run only here (no autofix in CI).
        run: ./app/vendor/bin/php-cs-fixer fix --dry-run --diff --no-interaction --show-progress=none --allow-risky=yes

  security-audit:
    name: security-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Run Composer security audit
        run: composer audit --no-interaction --abandoned=ignore
