name: PHP Quality

run-name: "${{ github.event_name == 'pull_request' && format('PHP Quality — PR #{0} ({1})', github.event.pull_request.number, github.head_ref) || format('PHP Quality — {0}', github.ref_name) }}"

on:
  push:
    branches: [main, develop]
    # Conductor session metrics live on conductor-metrics (not develop). Keep ignore as
    # defense in depth if a metrics path ever appears on develop again.
    paths-ignore:
      - '.github/conductor/metrics/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '.github/conductor/metrics/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: phpunit (${{ matrix.php }})
    runs-on: ubuntu-latest
    # id-token: write lets the Codecov step authenticate tokenless via OIDC
    # (no CODECOV_TOKEN secret needed). contents: read is required for checkout;
    # job-level permissions REPLACE the workflow-level block, so restate it here.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          tools: composer:v2

      - name: Cache Composer dependencies (app/vendor)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: app/vendor
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Create writable runtime directories
        run: mkdir -p tmp/logs tmp/cache tmp/temp tmp/packages storage

      - name: Run PHPUnit with coverage
        run: ./app/vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml

      - name: Upload coverage artifact
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-clover
          path: coverage.xml
          if-no-files-found: error

      # Codecov upload (Step 2.1.9, §4.3) — feeds the README badge and per-PR
      # coverage-delta comments off the same Clover report. Kept NON-BLOCKING
      # (fail_ci_if_error: false) so the quality gate never depends on Codecov
      # availability. Authenticates TOKENLESS via OIDC (use_oidc: true) — no
      # CODECOV_TOKEN secret to manage or rotate; relies on the job-level
      # id-token: write permission set above. EXTERNAL ACTIVATION REQUIRED: a
      # human must still install the Codecov GitHub App on Shadesman5/pagekit so
      # the repo is registered on Codecov (enables the badge + PR delta comments).
      # Note: OIDC is unavailable for PRs from forks — those fall back to the
      # public-repo tokenless path or simply no-op (non-blocking). See
      # migration-docs/branches/phase-2/step-2-1-9-test-coverage-expansion.md.
      - name: Upload coverage to Codecov
        if: matrix.php == '8.3'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: ./coverage.xml
          slug: Shadesman5/pagekit
          fail_ci_if_error: false
          use_oidc: true

      # Ratcheting minimum line-coverage gate (Step 2.1.9, §4.2). The floor is
      # pinned to this branch's measured line coverage after Steps 1-11 landed:
      # 3.86% (1833/47535 statements, PCOV 1.0.11 / PHP 8.3.6, 2026-07-09),
      # rounded DOWN to 3.8% for float jitter. CI and local agents both use PCOV.
      # Policy: ratchet MIN_LINE_COVERAGE UP as coverage grows, NEVER lower it.
      # Plain PHP parse of the Clover <project><metrics> node — no extra tooling required.
      # Provenance recorded in migration-docs/branches/phase-2.
      - name: Enforce minimum line coverage
        if: matrix.php == '8.3'
        env:
          MIN_LINE_COVERAGE: '3.8'
        run: |
          php -r '
            $min = (float) getenv("MIN_LINE_COVERAGE");
            $dom = new DOMDocument();
            if (!@$dom->load("coverage.xml")) {
                fwrite(STDERR, "ERROR: unable to load coverage.xml\n");
                exit(2);
            }
            $nodes = (new DOMXPath($dom))->query("/coverage/project/metrics");
            if ($nodes === false || $nodes->length === 0) {
                fwrite(STDERR, "ERROR: <project><metrics> not found in coverage.xml\n");
                exit(2);
            }
            $metrics = $nodes->item(0);
            $statements = (int) $metrics->getAttribute("statements");
            $covered = (int) $metrics->getAttribute("coveredstatements");
            if ($statements <= 0) {
                fwrite(STDERR, "ERROR: coverage.xml reports zero statements\n");
                exit(2);
            }
            $rate = $covered / $statements * 100;
            printf("Line coverage: %.4f%% (%d/%d statements) | required floor: %.2f%%\n", $rate, $covered, $statements, $min);
            if ($rate + 1e-9 < $min) {
                fwrite(STDERR, sprintf("FAIL: line coverage %.4f%% is below the required %.2f%% baseline (ratchets up, never down).\n", $rate, $min));
                exit(1);
            }
            echo "PASS: line coverage meets the ratcheted baseline.\n";
          '

  phpstan:
    name: phpstan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies (app/vendor)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: app/vendor
          key: ${{ runner.os }}-php-8.3-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.3-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPStan (Level 5 + baseline)
        run: ./app/vendor/bin/phpstan analyse --no-progress --error-format=github

  cs-fixer:
    name: cs-fixer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies (app/vendor)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: app/vendor
          key: ${{ runner.os }}-php-8.3-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.3-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHP-CS-Fixer (dry-run)
        # --allow-risky=yes is required because .php-cs-fixer.php enables risky rules
        # (modernize_types_casting, declare_strict_types). Matches the local invocation.
        # CS-Fixer runs dry-run only in CI (no autofix) — any violation fails the gate.
        run: ./app/vendor/bin/php-cs-fixer fix --dry-run --diff --no-interaction --show-progress=none --allow-risky=yes

  security-audit:
    name: security-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Run Composer security audit
        run: composer audit --locked --no-interaction --abandoned=ignore
