name: PHP Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: phpunit (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          tools: composer:v2

      - name: Cache Composer dependencies (app/vendor)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: app/vendor
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Create writable runtime directories
        run: mkdir -p tmp/logs tmp/cache tmp/temp tmp/packages storage

      - name: Run PHPUnit with coverage
        run: ./app/vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml

      - name: Upload coverage artifact
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-clover
          path: coverage.xml
          if-no-files-found: error

      # Ratcheting minimum line-coverage gate (Step 2.1.9, §4.2). The floor is
      # pinned to this branch's measured line coverage after Steps 1-11 landed:
      # 3.86% (1833/47535 statements, PCOV 1.0.11 / PHP 8.3.6, 2026-07-09),
      # rounded DOWN to 3.8% so the gate tolerates the PCOV-vs-Xdebug counting
      # difference (CI measures with Xdebug) and general float jitter. Policy:
      # ratchet MIN_LINE_COVERAGE UP as coverage grows, NEVER lower it. Plain PHP
      # parse of the Clover <project><metrics> node — no extra tooling required.
      # Provenance recorded in migration-docs/branches/phase-2.
      - name: Enforce minimum line coverage
        if: matrix.php == '8.3'
        env:
          MIN_LINE_COVERAGE: '3.8'
        run: |
          php -r '
            $min = (float) getenv("MIN_LINE_COVERAGE");
            $dom = new DOMDocument();
            if (!@$dom->load("coverage.xml")) {
                fwrite(STDERR, "ERROR: unable to load coverage.xml\n");
                exit(2);
            }
            $nodes = (new DOMXPath($dom))->query("/coverage/project/metrics");
            if ($nodes === false || $nodes->length === 0) {
                fwrite(STDERR, "ERROR: <project><metrics> not found in coverage.xml\n");
                exit(2);
            }
            $metrics = $nodes->item(0);
            $statements = (int) $metrics->getAttribute("statements");
            $covered = (int) $metrics->getAttribute("coveredstatements");
            if ($statements <= 0) {
                fwrite(STDERR, "ERROR: coverage.xml reports zero statements\n");
                exit(2);
            }
            $rate = $covered / $statements * 100;
            printf("Line coverage: %.4f%% (%d/%d statements) | required floor: %.2f%%\n", $rate, $covered, $statements, $min);
            if ($rate + 1e-9 < $min) {
                fwrite(STDERR, sprintf("FAIL: line coverage %.4f%% is below the required %.2f%% baseline (ratchets up, never down).\n", $rate, $min));
                exit(1);
            }
            echo "PASS: line coverage meets the ratcheted baseline.\n";
          '

  phpstan:
    name: phpstan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies (app/vendor)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: app/vendor
          key: ${{ runner.os }}-php-8.3-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.3-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPStan (Level 5 + baseline)
        run: ./app/vendor/bin/phpstan analyse --no-progress --error-format=github

  cs-fixer:
    name: cs-fixer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies (app/vendor)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: app/vendor
          key: ${{ runner.os }}-php-8.3-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.3-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHP-CS-Fixer (dry-run)
        # --allow-risky=yes is required because .php-cs-fixer.php enables risky rules
        # (modernize_types_casting, declare_strict_types). Matches the local invocation.
        # CS-Fixer runs dry-run only in CI (no autofix) — any violation fails the gate.
        run: ./app/vendor/bin/php-cs-fixer fix --dry-run --diff --no-interaction --show-progress=none --allow-risky=yes

  security-audit:
    name: security-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Run Composer security audit
        run: composer audit --locked --no-interaction --abandoned=ignore
