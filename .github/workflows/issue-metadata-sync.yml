# Parses a <!-- metadata --> block from issue bodies and applies labels + milestone.
# Chains with project-auto-phase.yml: this workflow adds labels → labeled event
# triggers project-auto-phase → Phase field set in Project board.
#
# Metadata block format (hidden in rendered markdown):
#
#   <!-- metadata
#   labels: phase-1, migration, backend
#   milestone: Phase 1: Foundation
#   -->
#
# Triggers:
#   - issues.opened  → new issue with metadata block
#   - issues.edited  → metadata block was updated
#
# Requires:
#   Secret: PROJECT_TOKEN - PAT with repo scope
#     (MUST be a PAT, not GITHUB_TOKEN, so that label events trigger project-auto-phase.yml)

name: Sync Issue Metadata

on:
  issues:
    types: [opened, edited]

jobs:
  sync-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Parse metadata and apply labels/milestone
        uses: actions/github-script@v7
        with:
          # Use PAT so that label events trigger project-auto-phase.yml
          # (GITHUB_TOKEN events don't trigger other workflows)
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';

            // ================================================================
            // Parse <!-- metadata ... --> block
            // ================================================================
            const metadataMatch = body.match(/<!--\s*metadata\s*\n([\s\S]*?)-->/i);

            if (!metadataMatch) {
              console.log(`No <!-- metadata --> block found in issue #${issue.number}. Skipping.`);
              return;
            }

            const metadataBlock = metadataMatch[1];
            console.log(`Found metadata block in issue #${issue.number}:\n${metadataBlock}`);

            // Parse key-value pairs (labels, milestone, pr)
            const metadata = {};
            for (const line of metadataBlock.split('\n')) {
              const kv = line.match(/^\s*(\w+)\s*:\s*(.+)\s*$/);
              if (kv) {
                metadata[kv[1].toLowerCase()] = kv[2].trim();
              }
            }

            console.log('Parsed metadata:', JSON.stringify(metadata, null, 2));

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = issue.number;

            // ================================================================
            // Apply labels
            // ================================================================
            if (metadata.labels) {
              const desiredLabels = metadata.labels
                .split(',')
                .map(l => l.trim())
                .filter(Boolean);

              const currentLabels = issue.labels.map(l => l.name);
              const newLabels = desiredLabels.filter(l => !currentLabels.includes(l));

              if (newLabels.length > 0) {
                // Verify all labels exist before adding
                const repoLabels = await github.paginate(
                  github.rest.issues.listLabelsForRepo,
                  { owner, repo, per_page: 100 }
                );
                const repoLabelNames = repoLabels.map(l => l.name);

                const validLabels = newLabels.filter(l => repoLabelNames.includes(l));
                const invalidLabels = newLabels.filter(l => !repoLabelNames.includes(l));

                if (invalidLabels.length > 0) {
                  core.warning(`Unknown labels (not in repo): ${invalidLabels.join(', ')}`);
                }

                if (validLabels.length > 0) {
                  await github.rest.issues.addLabels({
                    owner, repo,
                    issue_number: issueNumber,
                    labels: validLabels,
                  });
                  console.log(`✅ Added labels: [${validLabels.join(', ')}]`);
                }
              } else {
                console.log('Labels already up to date');
              }
            }

            // ================================================================
            // Apply milestone
            // ================================================================
            if (metadata.milestone) {
              const currentMilestone = issue.milestone ? issue.milestone.title : null;

              // Normalize: allow shorthand "Phase 1" → "Phase 1: Foundation"
              const milestoneFullNames = {
                'Phase 1': 'Phase 1: Foundation',
                'Phase 2': 'Phase 2: Developer Experience',
                'Phase 3': 'Phase 3: Frontend Modernization',
                'Phase 4': 'Phase 4: Production Ready',
                'Phase 5': 'Phase 5: Advanced Features',
              };

              const milestoneName = milestoneFullNames[metadata.milestone] || metadata.milestone;

              if (currentMilestone !== milestoneName) {
                const milestones = await github.rest.issues.listMilestones({
                  owner, repo,
                  state: 'open',
                });
                const ms = milestones.data.find(m => m.title === milestoneName);

                if (ms) {
                  await github.rest.issues.update({
                    owner, repo,
                    issue_number: issueNumber,
                    milestone: ms.number,
                  });
                  console.log(`✅ Set milestone: ${milestoneName}`);
                } else {
                  core.warning(`Milestone "${milestoneName}" not found. Available: ${milestones.data.map(m => m.title).join(', ')}`);
                }
              } else {
                console.log('Milestone already up to date');
              }
            }

            // ================================================================
            // Log PR reference (informational only, linking is done by PR body)
            // ================================================================
            if (metadata.pr) {
              console.log(`📎 Related PR: ${metadata.pr}`);
            }

            console.log(`\n✅ Metadata sync complete for issue #${issueNumber}`);
