# Parses a <!-- metadata --> block from issue bodies and applies labels + milestone.
# Chains with project-auto-phase.yml: this workflow adds labels → labeled event
# triggers project-auto-phase → Phase field set in Project board.
#
# Metadata block format (hidden in rendered markdown):
#
#   <!-- metadata
#   labels: phase-1, migration, backend
#   milestone: Phase 1: Foundation
#   -->
#
# Triggers:
#   - issues.opened  → new issue with metadata block
#   - issues.edited  → metadata block was updated
#
# Security:
#   Only processes metadata from trusted authors (OWNER, MEMBER, COLLABORATOR).
#   External contributors' metadata blocks are ignored.
#
# Label sync:
#   Labels are synced bidirectionally within the "managed" set.
#   Labels in the metadata block are added; managed labels NOT in the block are removed.
#   Labels outside the managed set (e.g. "good first issue") are never touched.
#
# Requires:
#   Secret: PROJECT_TOKEN - PAT with repo scope
#     (MUST be a PAT, not GITHUB_TOKEN, so that label events trigger project-auto-phase.yml)

name: Sync Issue Metadata

on:
  issues:
    types: [opened, edited]

jobs:
  sync-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Parse metadata and apply labels/milestone
        uses: actions/github-script@v7
        with:
          # Use PAT so that label events trigger project-auto-phase.yml
          # (GITHUB_TOKEN events don't trigger other workflows)
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const sender = context.payload.sender;

            // ================================================================
            // Security: only trust OWNER, MEMBER, COLLABORATOR
            // ================================================================
            const trustedAssociations = ['OWNER', 'MEMBER', 'COLLABORATOR'];
            const association = issue.author_association || context.payload.issue.author_association;

            if (!trustedAssociations.includes(association)) {
              console.log(`Untrusted author_association "${association}" for issue #${issue.number} (by ${sender.login}). Skipping metadata sync.`);
              return;
            }

            // ================================================================
            // Parse <!-- metadata ... --> block
            // ================================================================
            const metadataMatch = body.match(/<!--\s*metadata\s*\n([\s\S]*?)-->/i);

            if (!metadataMatch) {
              console.log(`No <!-- metadata --> block found in issue #${issue.number}. Skipping.`);
              return;
            }

            const metadataBlock = metadataMatch[1];
            console.log(`Found metadata block in issue #${issue.number}:\n${metadataBlock}`);

            // Parse key-value pairs (labels, milestone, pr)
            const metadata = {};
            for (const line of metadataBlock.split('\n')) {
              const kv = line.match(/^\s*(\w+)\s*:\s*(.+)\s*$/);
              if (kv) {
                metadata[kv[1].toLowerCase()] = kv[2].trim();
              }
            }

            console.log('Parsed metadata:', JSON.stringify(metadata, null, 2));

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = issue.number;

            // ================================================================
            // Managed label set (only these are synced by this workflow)
            // Labels outside this set are never added or removed.
            // ================================================================
            const MANAGED_LABELS = new Set([
              // Phase labels
              'phase-1', 'phase-2', 'phase-3', 'phase-4', 'phase-5',
              // Type labels
              'migration', 'enhancement', 'bug', 'performance', 'security', 'documentation',
              // Area labels
              'frontend', 'backend', 'database', 'module', 'theme',
            ]);

            // ================================================================
            // Sync labels (add missing, remove stale within managed set)
            // ================================================================
            if (metadata.labels) {
              const desiredLabels = metadata.labels
                .split(',')
                .map(l => l.trim())
                .filter(Boolean);

              const currentLabels = issue.labels.map(l => l.name);

              // Validate desired labels exist in repo
              const repoLabels = await github.paginate(
                github.rest.issues.listLabelsForRepo,
                { owner, repo, per_page: 100 }
              );
              const repoLabelNames = new Set(repoLabels.map(l => l.name));

              const validDesired = desiredLabels.filter(l => repoLabelNames.has(l));
              const invalidDesired = desiredLabels.filter(l => !repoLabelNames.has(l));

              if (invalidDesired.length > 0) {
                core.warning(`Unknown labels (not in repo): ${invalidDesired.join(', ')}`);
              }

              // Labels to ADD: in metadata but not on issue
              const toAdd = validDesired.filter(l => !currentLabels.includes(l));

              // Labels to REMOVE: on issue AND in managed set, but NOT in metadata
              const desiredSet = new Set(validDesired);
              const toRemove = currentLabels.filter(l =>
                MANAGED_LABELS.has(l) && !desiredSet.has(l)
              );

              if (toAdd.length > 0) {
                await github.rest.issues.addLabels({
                  owner, repo,
                  issue_number: issueNumber,
                  labels: toAdd,
                });
                console.log(`Added labels: [${toAdd.join(', ')}]`);
              }

              for (const label of toRemove) {
                await github.rest.issues.removeLabel({
                  owner, repo,
                  issue_number: issueNumber,
                  name: label,
                });
                console.log(`Removed stale label: ${label}`);
              }

              if (toAdd.length === 0 && toRemove.length === 0) {
                console.log('Labels already in sync');
              }
            }

            // ================================================================
            // Apply milestone
            // ================================================================
            if (metadata.milestone) {
              const currentMilestone = issue.milestone ? issue.milestone.title : null;

              // Normalize: allow shorthand "Phase 1" → "Phase 1: Foundation"
              const milestoneFullNames = {
                'Phase 1': 'Phase 1: Foundation',
                'Phase 2': 'Phase 2: Developer Experience',
                'Phase 3': 'Phase 3: Frontend Modernization',
                'Phase 4': 'Phase 4: Production Ready',
                'Phase 5': 'Phase 5: Advanced Features',
              };

              const milestoneName = milestoneFullNames[metadata.milestone] || metadata.milestone;

              if (currentMilestone !== milestoneName) {
                const milestones = await github.rest.issues.listMilestones({
                  owner, repo,
                  state: 'open',
                });
                const ms = milestones.data.find(m => m.title === milestoneName);

                if (ms) {
                  await github.rest.issues.update({
                    owner, repo,
                    issue_number: issueNumber,
                    milestone: ms.number,
                  });
                  console.log(`Set milestone: ${milestoneName}`);
                } else {
                  core.warning(`Milestone "${milestoneName}" not found. Available: ${milestones.data.map(m => m.title).join(', ')}`);
                }
              } else {
                console.log('Milestone already up to date');
              }
            }

            // ================================================================
            // Log PR reference (informational only, linking is done by PR body)
            // ================================================================
            if (metadata.pr) {
              console.log(`Related PR: ${metadata.pr}`);
            }

            console.log(`\nMetadata sync complete for issue #${issueNumber}`);
