# Parses a <!-- metadata --> block from issue/PR bodies and applies labels + milestone.
# Chains with project-auto-phase.yml: this workflow adds labels → labeled event
# triggers project-auto-phase → Phase field set in Project board.
#
# Metadata block format (hidden in rendered markdown, MUST use multi-line):
#
#   <!-- metadata
#   labels: phase-1, migration, backend
#   milestone: Phase 1: Foundation
#   closes: #42, #43
#   -->
#
# Triggers:
#   - issues.opened / issues.edited       → issue with metadata block
#   - pull_request.opened / .edited       → PR with metadata block
#
# Security:
#   Only processes metadata from trusted senders (admin or write access).
#   Checks the actual repo permission of whoever triggered the event (sender),
#   not the original author — so edits by collaborators on agent-created
#   issues/PRs are correctly trusted. Non-collaborators (404) are gracefully
#   rejected without failing the workflow.
#
# Label sync:
#   Only labels in the MANAGED_LABELS set are added or removed.
#   Labels outside the managed set (e.g. "good first issue") are never touched.
#   If the metadata block contains unknown labels, sync is aborted entirely
#   to prevent typos from silently stripping valid labels.
#
# Requires:
#   Secret: PROJECT_TOKEN - PAT with repo scope
#     (MUST be a PAT, not GITHUB_TOKEN, so that label events trigger project-auto-phase.yml)

name: Sync Metadata

on:
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited]

jobs:
  sync-metadata:
    runs-on: ubuntu-latest
    # Skip fork PRs — secrets.PROJECT_TOKEN is unavailable and the sender
    # cannot have write access anyway. Issue events always run.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Parse metadata and apply labels/milestone
        uses: actions/github-script@v7
        with:
          # Use PAT so that label events trigger project-auto-phase.yml
          # (GITHUB_TOKEN events don't trigger other workflows)
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            // ================================================================
            // Normalize payload: works for both issues and pull_requests.
            // GitHub's Issues API handles labels/milestones for PRs too
            // (PRs are issues internally), so we just need the number + body.
            // ================================================================
            const isPR = !!context.payload.pull_request;
            const item = isPR ? context.payload.pull_request : context.payload.issue;
            const body = item.body || '';
            const sender = context.payload.sender;
            const itemType = isPR ? 'PR' : 'issue';
            const itemNumber = item.number;

            // ================================================================
            // Security: only trust senders with write or admin access.
            // Uses sender (who triggered the event), NOT author_association
            // which reflects the original author — important because the Cloud
            // Agent (ghs_ token) creates items with author_association "NONE".
            //
            // getCollaboratorPermissionLevel returns 404 for non-collaborators,
            // so we catch that and treat it as untrusted.
            // ================================================================
            let permission = 'none';
            try {
              const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: sender.login,
              });
              permission = perm.permission;
            } catch (err) {
              if ([401, 403, 404].includes(err.status)) {
                console.log(`Sender "${sender.login}" permission check failed (${err.status}). Skipping metadata sync for ${itemType} #${itemNumber}.`);
                return;
              }
              throw err;
            }

            const trustedPermissions = ['admin', 'write'];
            if (!trustedPermissions.includes(permission)) {
              console.log(`Sender "${sender.login}" has "${permission}" permission for ${itemType} #${itemNumber}. Skipping metadata sync.`);
              return;
            }

            // ================================================================
            // Parse <!-- metadata ... --> block
            // Supports multi-line format only:
            //   <!-- metadata
            //   labels: ...
            //   milestone: ...
            //   closes: #42, #43
            //   -->
            // ================================================================
            const metadataMatch = body.match(/<!--\s*metadata\s*\n([\s\S]*?)-->/i);

            if (!metadataMatch) {
              console.log(`No <!-- metadata --> block found in ${itemType} #${itemNumber}. Skipping.`);
              return;
            }

            const metadataBlock = metadataMatch[1];
            console.log(`Found metadata block in ${itemType} #${itemNumber}:\n${metadataBlock}`);

            // Parse key-value pairs (labels, milestone, closes)
            const metadata = {};
            for (const line of metadataBlock.split('\n')) {
              const kv = line.match(/^\s*(\w+)\s*:\s*(.+)\s*$/);
              if (kv) {
                metadata[kv[1].toLowerCase()] = kv[2].trim();
              }
            }

            console.log('Parsed metadata:', JSON.stringify(metadata, null, 2));

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // ================================================================
            // Managed label set — ONLY these labels are added or removed.
            // Any label not in this set is completely ignored by this workflow.
            // ================================================================
            const MANAGED_LABELS = new Set([
              // Phase labels
              'phase-1', 'phase-2', 'phase-3', 'phase-4', 'phase-5',
              // Type labels
              'migration', 'enhancement', 'bug', 'performance', 'security', 'documentation',
              // Area labels
              'frontend', 'backend', 'database', 'module', 'theme',
            ]);

            // ================================================================
            // Sync labels (add missing, remove stale — within managed set only)
            // ================================================================
            if (metadata.labels) {
              const desiredLabels = metadata.labels
                .split(',')
                .map(l => l.trim())
                .filter(Boolean);

              // Separate managed from unmanaged desired labels
              const managedDesired = desiredLabels.filter(l => MANAGED_LABELS.has(l));
              const unmanagedDesired = desiredLabels.filter(l => !MANAGED_LABELS.has(l));

              if (unmanagedDesired.length > 0) {
                core.warning(`Labels not in managed set (ignored): ${unmanagedDesired.join(', ')}. Managed labels: ${[...MANAGED_LABELS].join(', ')}`);
              }

              // Validate managed labels exist in repo
              const repoLabels = await github.paginate(
                github.rest.issues.listLabelsForRepo,
                { owner, repo, per_page: 100 }
              );
              const repoLabelNames = new Set(repoLabels.map(l => l.name));

              const invalidLabels = managedDesired.filter(l => !repoLabelNames.has(l));

              if (invalidLabels.length > 0) {
                // Abort sync entirely — a typo could silently strip valid labels
                core.setFailed(`Unknown labels in metadata block: ${invalidLabels.join(', ')}. Label sync aborted to prevent accidental removal. Fix the metadata block and re-save the ${itemType}.`);
                return;
              }

              const currentLabels = item.labels.map(l => l.name);
              const desiredSet = new Set(managedDesired);

              // Labels to ADD: managed + in metadata + not on item
              const toAdd = managedDesired.filter(l => !currentLabels.includes(l));

              // Labels to REMOVE: on item + in managed set + NOT in metadata
              const toRemove = currentLabels.filter(l =>
                MANAGED_LABELS.has(l) && !desiredSet.has(l)
              );

              if (toAdd.length > 0) {
                await github.rest.issues.addLabels({
                  owner, repo,
                  issue_number: itemNumber,
                  labels: toAdd,
                });
                console.log(`Added labels: [${toAdd.join(', ')}]`);
              }

              for (const label of toRemove) {
                await github.rest.issues.removeLabel({
                  owner, repo,
                  issue_number: itemNumber,
                  name: label,
                });
                console.log(`Removed stale label: ${label}`);
              }

              if (toAdd.length === 0 && toRemove.length === 0) {
                console.log('Labels already in sync');
              }
            }

            // ================================================================
            // Apply milestone
            // ================================================================
            if (metadata.milestone) {
              const currentMilestone = item.milestone ? item.milestone.title : null;

              // Normalize: allow shorthand "Phase 1" → "Phase 1: Foundation"
              const milestoneFullNames = {
                'Phase 1': 'Phase 1: Foundation',
                'Phase 2': 'Phase 2: Developer Experience',
                'Phase 3': 'Phase 3: Frontend Modernization',
                'Phase 4': 'Phase 4: Production Ready',
                'Phase 5': 'Phase 5: Advanced Features',
              };

              const milestoneName = milestoneFullNames[metadata.milestone] || metadata.milestone;

              if (currentMilestone !== milestoneName) {
                const milestones = await github.rest.issues.listMilestones({
                  owner, repo,
                  state: 'open',
                });
                const ms = milestones.data.find(m => m.title === milestoneName);

                if (ms) {
                  await github.rest.issues.update({
                    owner, repo,
                    issue_number: itemNumber,
                    milestone: ms.number,
                  });
                  console.log(`Set milestone: ${milestoneName}`);
                } else {
                  core.warning(`Milestone "${milestoneName}" not found. Available: ${milestones.data.map(m => m.title).join(', ')}`);
                }
              } else {
                console.log('Milestone already up to date');
              }
            }

            // ================================================================
            // Log closes references (informational — GitHub handles the actual
            // linking when PRs contain "Closes #X" in the body text)
            // ================================================================
            if (metadata.closes) {
              console.log(`Closes references: ${metadata.closes}`);
            }

            console.log(`\nMetadata sync complete for ${itemType} #${itemNumber}`);
