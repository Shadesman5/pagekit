name: Infection

run-name: "Infection — PR #${{ github.event.pull_request.number }} (${{ github.head_ref }})"

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Mutation-testing gate scoped to the PR diff. Infection only mutates lines changed
  # against the base branch, keeping the run fast. Source directories are intentionally narrow
  # (auth + user only — see infection.json.dist); PRs that touch none of them skip the
  # Infection binary (job stays green) — that is expected, not a broken check.
  infection-diff:
    name: infection-diff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Full history so the merge base with the PR base branch is reachable for both
          # the scope diff below and Infection's --git-diff-base line comparison.
          fetch-depth: 0

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          # PCOV drives the code coverage Infection needs to decide which mutants are covered.
          coverage: pcov
          tools: composer:v2

      - name: Cache Composer dependencies (app/vendor)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: app/vendor
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.5-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Create writable runtime directories
        run: mkdir -p tmp/logs tmp/cache tmp/temp tmp/packages storage

      - name: Fetch PR base ref
        # actions/checkout does not create the origin/<base> remote-tracking ref on a
        # pull_request build; fetch it explicitly so the diff and Infection can resolve it.
        run: git fetch --no-tags --prune origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"

      - name: Detect changes in the Infection source scope
        id: scope
        # Mirror infection.json.dist source.directories: skip the run entirely when the PR
        # touches none of them, so an out-of-scope PR exits green without booting Infection.
        run: |
          changed="$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" -- \
            app/modules/auth/src \
            app/system/modules/user/src/Model \
            app/system/modules/user/src/Auth \
            app/system/modules/user/src/Event)"
          if [ -n "$changed" ]; then
            echo "Infection source files changed in this PR:"
            echo "$changed"
            echo "in_scope=true" >> "$GITHUB_OUTPUT"
          else
            echo "No files under the Infection source scope changed — skipping mutation testing (green)."
            echo "in_scope=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Infection skipped (out of scope)"
              echo ""
              echo "This PR does not change any file under the configured Infection source directories"
              echo "(\`app/modules/auth/src\`, \`app/system/modules/user/src/{Model,Auth,Event}\`)."
              echo "Diff-scoped mutation testing is intentionally skipped; the check stays green."
              echo "Full-suite MSI still comes from the Nightly \`infection-full\` job on \`develop\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run Infection on the PR diff
        if: steps.scope.outputs.in_scope == 'true'
        # --git-diff-lines mutates only lines changed vs the base; --min-covered-msi=80 matches
        # infection.json.dist; --logger-github annotates escaped mutants inline on the PR.
        run: ./app/vendor/bin/infection --threads=max --git-diff-lines --git-diff-base="origin/${GITHUB_BASE_REF}" --logger-github --min-covered-msi=80

      - name: Upload Infection logs
        if: always() && steps.scope.outputs.in_scope == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infection-report
          path: tmp/infection/
          if-no-files-found: warn
