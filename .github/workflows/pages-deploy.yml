# Builds docs-site (MkDocs Material) and deploys to GitHub Pages.
# Requires: Settings → Pages → Source = "GitHub Actions"
#
# Do NOT use the "Jekyll" or "Static HTML" workflow templates from the Pages UI.
# This workflow is the single deploy path for the documentation site.
#
# Conductor session metrics live on the unprotected `conductor-metrics` branch and the live quality
# snapshot on the unprotected `quality-data` branch. Builds always use `develop` for docs/ROADMAP and
# overlay both from their data branches.

name: Deploy Docs to GitHub Pages

run-name: "${{ github.event_name == 'workflow_dispatch' && 'Docs deploy — manual' || format('Docs deploy — {0}', github.ref_name) }}"

on:
  push:
    branches: [develop]
    paths:
      - 'docs-site/**'
      - '.github/quality/quality-snapshot.json'
      - '.github/quality/quality-history.json'
      - '.cursor/ROADMAP.md'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages allows one live deployment at a time. Do not cancel an in-flight run — that
# leaves a red X and can stall the Pages backend. A newer run waits; GitHub still
# keeps only one pending request, so a burst still publishes once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop (docs + quality snapshot)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: develop
          fetch-depth: 0

      - name: Overlay conductor metrics from conductor-metrics
        run: |
          set -euo pipefail
          if git ls-remote --heads origin conductor-metrics | grep -q .; then
            git fetch origin conductor-metrics
            git checkout origin/conductor-metrics -- .github/conductor/metrics
            echo "Overlays metrics from origin/conductor-metrics"
          else
            echo "No conductor-metrics branch yet — using metrics (if any) from develop"
          fi

      - name: Overlay live quality snapshot and history from quality-data
        run: |
          set -euo pipefail
          if git ls-remote --heads origin quality-data | grep -q .; then
            git fetch origin quality-data
            git checkout origin/quality-data -- .github/quality/quality-snapshot.json
            echo "Overlaid quality snapshot from origin/quality-data"
            # The history file only appears once the collector has run with it; a branch predating
            # that must still deploy, so probe before checking it out.
            if git cat-file -e origin/quality-data:.github/quality/quality-history.json 2>/dev/null; then
              git checkout origin/quality-data -- .github/quality/quality-history.json
              echo "Overlaid quality history from origin/quality-data"
            else
              echo "No quality history on quality-data yet — dashboard renders without charts"
            fi
          else
            echo "No quality-data branch yet — using the seed snapshot from develop"
          fi

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Build site
        run: mkdocs build -f docs-site/mkdocs.yml

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
