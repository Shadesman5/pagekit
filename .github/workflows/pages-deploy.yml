# Builds docs-site (MkDocs Material) and deploys to GitHub Pages.
# Requires: Settings → Pages → Source = "GitHub Actions"
#
# Do NOT use the "Jekyll" or "Static HTML" workflow templates from the Pages UI.
# This workflow is the single deploy path for the documentation site.
#
# Conductor session metrics live on the unprotected `conductor-metrics` branch.
# Builds always use `develop` for docs/ROADMAP and overlay metrics from that branch.

name: Deploy Docs to GitHub Pages

run-name: "${{ github.event_name == 'workflow_dispatch' && 'Docs deploy — manual' || format('Docs deploy — {0}', github.ref_name) }}"

on:
  push:
    branches: [develop]
    paths:
      - 'docs-site/**'
      - '.github/quality/quality-snapshot.json'
      - '.cursor/ROADMAP.md'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop (docs + quality snapshot)
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Overlay conductor metrics from conductor-metrics
        run: |
          set -euo pipefail
          if git ls-remote --heads origin conductor-metrics | grep -q .; then
            git fetch origin conductor-metrics
            git checkout origin/conductor-metrics -- .github/conductor/metrics
            echo "Overlays metrics from origin/conductor-metrics"
          else
            echo "No conductor-metrics branch yet — using metrics (if any) from develop"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Build site
        run: mkdocs build -f docs-site/mkdocs.yml

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
