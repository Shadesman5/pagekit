# Builds docs-site (MkDocs Material) and deploys to GitHub Pages.
# Requires: Settings → Pages → Source = "GitHub Actions"
#
# Do NOT use the "Jekyll" or "Static HTML" workflow templates from the Pages UI.
# This workflow is the single deploy path for the documentation site.

name: Deploy Docs to GitHub Pages

run-name: "${{ github.event_name == 'workflow_dispatch' && 'Docs deploy — manual' || format('Docs deploy — {0}', github.ref_name) }}"

on:
  push:
    branches: [develop]
    paths:
      - 'docs-site/**'
      - '.github/quality/quality-snapshot.json'
      - '.github/conductor/metrics/**'
      - '.cursor/ROADMAP.md'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Build site
        run: mkdocs build -f docs-site/mkdocs.yml

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
