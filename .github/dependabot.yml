version: 2
updates:
  # Enable version updates for Composer (PHP)
  - package-ecosystem: 'composer'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 10
    reviewers:
      - 'Shadesman5'
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'php'

  # Enable version updates for npm/Yarn (JavaScript)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '10:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 10
    reviewers:
      - 'Shadesman5'
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'javascript'
    ignore:
      # Ignore Vue 2.x updates (major version change to Vue 3)
      - dependency-name: 'vue'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vue-*'
        update-types: ['version-update:semver-major']

  # Enable version updates for Docker
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '11:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    reviewers:
      - 'Shadesman5'
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'docker'

  # GitHub Actions (falls Sie später Actions hinzufügen)
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
      day: 'monday'
      time: '12:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    reviewers:
      - 'Shadesman5'
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'github-actions'
